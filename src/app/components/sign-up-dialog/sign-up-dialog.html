<div class="p-8 max-w-[400px] flex flex-col">
    <div class="flex justify-between">
        <div>
            <h2 class="text-xl font-medium mb-1">Sign Up</h2>
            <p class="text-sm text-gray-500">Join us and start shopping today</p>
        </div>
        <button tabindex="-1" matIconButton class="-mt-2 -mr-2" mat-dialog-close>
            <mat-icon>close</mat-icon>
        </button>
    </div>
    <form class="mt-6" [formGroup]="signUpForm" (ngSubmit)="signUp()">
        <mat-form-field class="mb-4" appearance="outline" subscriptSizing="dynamic">
            <input formControlName="name" matInput type="text" placeholder="Enter your name">
            <mat-icon matPrefix>person</mat-icon>
        </mat-form-field>
        
        <mat-form-field class="mb-4" appearance="outline" subscriptSizing="dynamic">
            <input formControlName="email" matInput type="email" placeholder="Enter your email">
            <mat-icon matPrefix>email</mat-icon>
        </mat-form-field>

        <mat-form-field class="mb-4" appearance="outline" subscriptSizing="dynamic">
            <input formControlName="password" matInput [type]="passwordVisible() ? 'text': 'password'" placeholder="Enter your password">
            <mat-icon matPrefix>lock</mat-icon>
            <button matSuffix matIconButton type="button" (click)="passwordVisible.set(!passwordVisible())" class="mr-2">
                <mat-icon [fontIcon]="passwordVisible()? 'visibility_off': 'visibility'"></mat-icon>
            </button>
        </mat-form-field>
        
        <mat-form-field class="mb-6" appearance="outline" subscriptSizing="dynamic">
            <input formControlName="confirmPassword" matInput [type]="ConfirmPasswordVisible() ? 'text' : 'password'" placeholder="Confirm your password"/>
            <mat-icon matPrefix>lock</mat-icon>
            <button matSuffix matIconButton type="button" class="mr-2" (click)="ConfirmPasswordVisible.set(!ConfirmPasswordVisible())">
                <mat-icon [fontIcon]="ConfirmPasswordVisible() ? 'visibility_off' : 'visibility'"></mat-icon>
            </button>
        </mat-form-field>
        
        <button type="submit" matButton="filled" class="w-full">
            Create account
        </button>
    </form>
    <p class="text-sm text-gray-500 mt-2 text-center">
        Already have an account? 
        <a class="text-blue-600 cursor-pointer" (click)="openSignInDialog()">Sign In</a>
    </p>
</div>
