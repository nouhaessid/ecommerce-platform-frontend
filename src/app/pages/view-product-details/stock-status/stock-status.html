@if (inStock()) {
  <div class="flex items-center gap-2 border border-green-200 rounded-lg bg-green-50 px-3 py-3 w-full">
    <mat-icon class="!text-green-600 shrink-0 mt-0.5 small">
      check_circle
    </mat-icon>

    <span class="flex-1 text-xs text-green-800 leading-relaxed">
      In stock and ready to ship
    </span>
  </div>
} @else {
  <div class="flex items-center gap-2 border border-red-200 rounded-lg bg-red-50 px-3 py-3 w-full">
    <mat-icon class="!text-red-600 shrink-0 mt-0.5 small">
      warning
    </mat-icon>

    <span class="flex-1 text-xs text-red-800 leading-relaxed">
      This item is currently out of stock. Add it to your wishlist to be notified when it's available again.
    </span>
  </div>
}
