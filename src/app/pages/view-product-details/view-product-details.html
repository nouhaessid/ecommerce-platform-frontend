<div class="mx-auto max-w-[1200px] py-6">
    <app-back-button class="mb-6" [navigateTo] ="backRoute()" >Continue Shopping</app-back-button>
    @if (store.selectedProduct(); as product) {
        <div class="flex gap-8 mb-8">
            <img [src]="product.imageUrl" class="w-[500px] h-[550px] object-cover rounded-lg"
                [style.view-transition-name]="'product-image'+ product.id"
            >
            <div class="flex-1">
                <app-product-info [product]="product"></app-product-info>
            </div>
        </div>
        <app-view-reviews [product]="product"></app-view-reviews>
    }
    @else {
  <div class="text-center py-16">
    <h2 class="text-2xl font-bold">Product not found</h2>
    <p class="text-gray-600 mt-2">
      This product may have been removed.
    </p>

    <button
      matButton="filled"
      routerLink="/products/all">
      Back to Products
    </button>
  </div>
}
</div>
