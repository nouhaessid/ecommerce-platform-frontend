<div appViewPanel>
    <h2 class="text-2xl font-bold mb-6 flex items-center gap-2">
        <mat-icon>credit_card</mat-icon>
        Payment
    </h2>

    <div class="flex justify-between items-center mb-6">
        <div class="ml-3">
            <p class="font-medium">Credit / Debit Card</p>
            <p class="text-sm text-gray-500">We accept Visa, Mastercard and American Express.</p>
        </div>

        <div class="flex items-center gap-3 mr-3">
            <img src="visa-logo.png" alt="Visa" class="h-8 w-auto">
            <img src="mastercard-logo.png" alt="Mastercard" class="h-8 w-auto">
            <img src="american-express.png" alt="American Express" class="h-8 w-auto">
        </div>
    </div>
    
    <form class="grid grid-cols-1 lg:grid-cols-2 gap-4">

        <mat-form-field class="lg:col-span-2" appearance="outline" subscriptSizing="dynamic">
            <mat-label>Card Number</mat-label>
            <input
                matInput
                type="text"
                placeholder="1234 5678 9012 3456">
            <mat-icon matPrefix>credit_card</mat-icon>
        </mat-form-field>

        <mat-form-field class="lg:col-span-2" appearance="outline" subscriptSizing="dynamic">
            <mat-label>Cardholder Name</mat-label>
            <input matInput type="text">
            <mat-icon matPrefix>person</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <mat-label>Expiry Date</mat-label>
            <input
                matInput
                type="text"
                placeholder="MM / YY">
        </mat-form-field>

        <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <mat-label>CVV</mat-label>
            <input
                matInput
                type="password"
                placeholder="123">
        </mat-form-field>

    </form>
</div>
